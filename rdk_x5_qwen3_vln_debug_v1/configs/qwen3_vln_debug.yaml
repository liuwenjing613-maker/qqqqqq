api:
  model: qwen3-vl-flash
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: QWEN_BASE_URL
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  timeout_sec: 35.0
  max_retries: 1
  temperature: 0.1
  max_tokens: 420
  enable_thinking: false

prompts:
  directory: prompts

image:
  topic: /image_raw
  transport: raw
  api_max_width: 960
  jpeg_quality: 88

state_machine:
  initial_instruction: find the bottle
  observe_interval_sec: 2.5
  track_interval_sec: 1.6
  search_interval_sec: 3.0
  verify_interval_sec: 9999.0
  error_cooldown_sec: 3.0
  min_confidence_visible: 0.55
  min_confidence_search_hint: 0.45
  min_confidence_verify: 0.60
  auto_enter_search: true

visualization:
  publish_hz: 8.0
  jpeg_quality: 88
  draw_center_line: true
  point_radius: 11
  history_length: 1

topics:
  instruction: /qwen_vln/instruction
  command: /qwen_vln/command
  annotated_image: /qwen_vln/annotated_image/compressed
  state: /qwen_vln/state
  result_json: /qwen_vln/result_json
  latency_ms: /qwen_vln/latency_ms
  pixel_point: /qwen_vln/pixel_point
  prompt_text: /qwen_vln/prompt_text
