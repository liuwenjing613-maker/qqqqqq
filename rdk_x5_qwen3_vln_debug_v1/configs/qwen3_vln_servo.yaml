# Additive V2 controller. It does not alter Qwen prompts, API parsing or FSM.
topics:
  state: /qwen_vln/state
  result_json: /qwen_vln/result_json
  scan: /scan_filtered
  scan_fallback: /scan

  # Match the existing semantic-explore stack: autonomy -> priority mux -> /cmd_vel.
  cmd_output: /cmd_vel_autonomy
  cmd_raw: /qwen_vln/servo/cmd_raw
  cmd_limited: /qwen_vln/servo/cmd_limited
  status: /qwen_vln/servo/status
  front_distance: /qwen_vln/servo/front_distance
  enabled: /qwen_vln/servo/enabled
  servo_command: /qwen_vln/servo/command

control:
  # Safe default. start_live_servo.sh passes --enable-motion only when
  # MOTION_ENABLED=1 is explicitly supplied.
  motion_enabled: false
  rate_hz: 20.0

  max_vx: 0.07
  max_wz: 0.05
  kp_wz: 0.05
  angular_sign: -1.0   # target/point right -> negative ROS angular.z

  center_deadband: 0.06
  turn_only_threshold: 0.40
  cmd_wz_deadband: 0.006

  # V2 core change: every fresh valid pixel can drive the chassis, regardless
  # of TARGET_VISIBLE / SEARCH_HINT / VERIFY_SUCCESS or semantic point_role.
  min_confidence: 0.0
  point_results_before_forward: 1

  # These are explicit lifecycle stops, not visibility filters. Remove an item
  # only if you deliberately want an old point to remain active in that state.
  blocked_states:
    - WAIT_IMAGE
    - PAUSED
    - SUCCESS
    - ERROR

  image_width_fallback: 960

freshness:
  # Effective source age = API latency + time since result reception.
  full_speed_source_age_sec: 0.95
  stop_source_age_sec: 2.00
  max_receive_gap_sec: 1.60

rate_limit:
  max_linear_accel: 0.08
  max_linear_decel: 0.16
  max_angular_accel: 0.12
  max_angular_decel: 0.25

safety:
  require_lidar: true
  scan_timeout_sec: 0.50

  # Change to 0 only after confirming /scan_filtered already aligns lidar zero
  # with camera forward.
  camera_lidar_yaw_offset_deg: -170.0
  front_sector_deg: 30.0
  front_percentile: 10.0

  emergency_stop_distance: 0.28
  stop_distance: 0.42
  slow_distance: 0.65
  allow_turn_inside_stop_distance: true
