selector:
  mode: dry_run
  allow_motion: false
  allow_nav2: false
  allow_coordinates: false

region_selection:
  # CANDIDATE_RANKING | GLOBAL_REGION_PROPOSAL
  strategy: GLOBAL_REGION_PROPOSAL
  fallback_strategy: CANDIDATE_RANKING
  strict_strategy_validation: true

global_region_proposal:
  enabled: true
  max_ranked_proposals: 3
  coordinate_space: NORMALIZED_MAP_VIEWPORT
  require_frontier_match: true
  max_frontier_snap_distance_m: 0.75
  minimum_bbox_width_normalized: 0.04
  minimum_bbox_height_normalized: 0.04
  maximum_bbox_width_normalized: 0.45
  maximum_bbox_height_normalized: 0.45
  minimum_frontier_overlap_ratio: 0.10
  maximum_occupied_ratio: 0.25
  allow_map_only_fallback: true
  try_next_proposal_on_validation_failure: true
  fallback_to_candidate_ranking: true

qwen_visual_input:
  payload_mode: DECISION_BOARD
  include_annotated_map: true
  include_trajectory: true
  include_visited_corridor: true
  include_observation_poses: true
  include_robot_pose: true
  include_360_views: true
  include_map_reference_grid: true

qwen:
  model_env: QWEN_MODEL
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: QWEN_BASE_URL
  default_model: qwen3-vl-flash
  default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  request_timeout_s: 30
  max_retries: 1
  max_tokens: 512
  require_image_input: true
  use_low_randomness: true

validation:
  require_snapshot_id_echo: true
  require_selected_label_in_snapshot: true
  require_unique_fallbacks: true
  reject_forbidden_fields: true

logging:
  root_dir: logs/qwen_region_selection
  save_prompt: true
  save_raw_response: true
  save_request_manifest: true
  save_validation: true
  save_global_proposal_validation: true

ros:
  max_snapshot_age_s: 300
  snapshot_topic: /qwen_explore_debug/region_snapshot_json
  instruction_topic: /qwen_explore/target_instruction
  status_topic: /qwen_explore/region_selection_status
  decision_topic: /qwen_explore/region_decision_json
  debug_topic: /qwen_explore/region_selection_debug_json
  select_service: /qwen_explore/select_region

node:
  name: qwen_region_selector

decision_fusion:
  map_only_geo_weight: 0.85
  map_only_qwen_weight: 0.15
  visual_geo_weight: 0.65
  visual_qwen_weight: 0.35
  reject_if_geo_score_below: 0.40
  max_allowed_geo_gap_without_visual_evidence: 0.20

decision_revalidation:
  max_snapshot_age_s: 20.0
  max_robot_translation_m: 0.15
  max_robot_yaw_change_deg: 20.0
  max_map_cell_change_ratio: 0.10
  require_selected_track_still_present: true
  require_selected_track_still_stable: true

safety:
  observation_only: true
  motion_enabled: false
  nav2_enabled: false

data_contract:
  config_file: configs/exploration_data_contract.yaml
