mode: yolo_lidar_semantic_explore_nav
instruction: find the bottle
image_topic: /image_raw
scan_topic: /scan
cmd_topic: /cmd_vel
target_bbox_topic: /target_bbox_json
target_words_topic: /target_words
state_topic: /nav_state
point_topic: /nav_target_point
target_words:
- bottle
lidar_front_deg: 30.0
camera_lidar_yaw_offset_deg: -170.0
camera_hfov_deg: 70.0
topics:
  image_raw: /image_raw
  scan: /scan
  odom: /odom
  cmd_vel: /cmd_vel
  target_bbox_json: /target_bbox_json
  target_words: /target_words
  nav_state: /nav_state
  nav_target_point: /nav_target_point
  semantic_map_json: /semantic_map_json
  explore_goal_hint: /explore_goal_hint
  explore_state: /explore_state_json
  explore_candidate_goals: /explore_candidate_goals
  explore_selected_goal: /explore_selected_goal
  explore_frontiers: /explore_frontiers
  explore_path: /explore_path
  explore_selection_process: /explore_selection_process
  explore_astar_markers: /explore_astar_markers
  scan_filtered: /scan_filtered
foxglove:
  port: 8765
  layout: configs/foxglove_semantic_explore_nav.layout.json
  image_topic: /yolov5s_bpu/annotated/compressed
camera:
  device: /dev/video0
  compressed_topic: /image
  width: 1280
  height: 720
  image_raw_max_fps: 8
yolo_world:
  enabled: false
yolov5s_bpu:
  enabled: true
  model: /root/rdk_model_zoo/samples/vision/yolov5/model/yolov5s_tag_v7.0_detect_640x640_bayese_nv12.bin
  runtime_dir: /root/rdk_model_zoo/samples/vision/yolov5/runtime/python
  zoo_root: /root/rdk_model_zoo
  input_type: raw
  image_topic: /image_raw
  out_topic: /target_bbox_json
  target_words_topic: /target_words
  target_classes: bottle,cup,backpack,chair,dining table,book,potted plant,cell phone,couch
  score_threshold: 0.2
  nms_threshold: 0.45
  max_hz: 8.0
yolo_bridge:
  enabled: false
  out_topic: /target_bbox_json
  target_classes: bottle
  min_score: 0.2
  max_area_ratio: 0.3
  voter_window_size: 6
  voter_min_votes: 2
  voter_lost_hold_frames: 4
target:
  source: yolo_bbox
  words:
  - bottle
  classes:
  - bottle
  min_score: 0.2
  min_area_ratio: 0.0008
  max_area_ratio: 0.3
  accept_unknown_class: false
  accept_stale: false
voter:
  enabled: true
  window_size: 6
  min_votes: 2
  lost_hold_frames: 4
  iou_threshold: 0.05
  center_dist_threshold: 0.18
  smooth_alpha: 0.2
  accept_held_target: true
fsm:
  stable_frames_required: 3
  lost_frames_limit: 5
  centered_required_frames: 3
  max_search_sec: 180
  max_task_sec: 0
  min_state_frames: 2
birth_scan:
  enabled: true
  wait_sec: 5.0
  scan_wz: 0.05
  effective_scan_wz: 0.05
  scan_deg: 360.0
  max_rotations: 1.0
  turn_dir: 1.0
  views: 8
  record_sector: true
success:
  require_lidar: true
  target_recent_sec: 1.0
  min_score: 0.2
  center_px: 140
  min_safe_distance: 0.2
  stop_distance: 0.5
  lidar_success_distance: 0.5
  verify_distance_max: 0.5
  min_area_ratio: 0.5
  min_height_ratio: 0.55
  center_only_enabled: false
  arrive_frames: 1
  verify_frames: 2
  stop_verify_sec: 0.8
  emergency_target_recent_sec: 1.5
  lost_target_servo_sec: 0.6
  lost_target_vx_scale: 0.5
  qwen_verify_required: false
servo:
  max_vx: 0.06
  steer_vx: 0.05
  max_wz: 0.05
  kp_turn: 0.1
  center_deadband: 0.06
  turn_only_threshold: 0.4
  turn_only_vx: 0.0
  cmd_wz_deadband: 0.006
safety:
  require_lidar: true
  emergency_stop_distance: 0.28
  stop_distance: 0.42
  slow_distance: 0.65
  max_cmd_vx_explore: 0.04
  max_cmd_wz_explore: 0.05
  slow_vx: 0.045
  safe_turn_wz: 0.05
  max_cmd_vx: 0.04
  max_cmd_wz: 0.05
  turn_zero_vx_wz: 0.05
  turn_slow_vx_wz: 0.05
  turn_slow_vx_scale: 0.4
  blocked_retreat:
    enabled: true
    clearance_margin_m: 0.10
    reverse_vx: 0.05
    max_duration_sec: 5.0
    fsm_unblock_buffer_m: 0.02
search:
  scan_wz: 0.05
  search_arc_vx: 0.04
  pulse_sec: 0.35
  observe_sec: 0.1
  loss_memory_sec: 4.0
  free_space_after_loss_sec: 4.0
  free_space_enabled: false
  free_space_enable_after_sec: 4.0
  free_space_vx: 0.035
  free_space_min_clearance: 0.38
  turn_lock_sec: 6.0
  lidar_turn_min_delta: 0.15
  lidar_turn_side_deg: 45.0
  lidar_fallback_on_no_memory: true
track:
  blocked_hold_on_target: true
freshness:
  image_stale_sec: 1.2
  scan_stale_sec: 0.5
  bbox_stale_sec: 0.45
rates:
  decision_hz: 10
  control_hz: 20
  state_pub_hz: 5
  selector_hz: 2
  selector_log_hz: 1
chassis:
  bridge: pwm
  port: /dev/ttyUSB0
  max_vx: 0.06
  max_wz: 0.05
  watchdog_timeout: 0.5
  control_rate_hz: 20.0
  wheel_layout: fl-rl-fr-rr
  motor_signs: 1,1,1,1
  vx_pwm_deadband: 6.0
  wz_pwm_deadband: 10.0
  pwm_max: 40.0
  vx_pwm_gain: 180.0
  wz_pwm_gain: 120.0
  pwm_smooth_alpha: 0.35
  max_pwm_delta: 5.0
  debug: true
semantic_mapping:
  frames:
    fixed_frame: map
    fallback_frame: odom
    odom_frame: odom
    base_frame: base_link
    laser_frame: laser
    camera_frame: base_link
  topics:
    image_raw: /image_raw
    bbox_json: /target_bbox_json
    scan: /scan_filtered
    scan_fallback: /scan
    map: /map
    odom: /odom
    semantic_map_json: /semantic_map_json
    semantic_status: /semantic_status
    semantic_observations: /semantic_observations
    semantic_landmarks: /semantic_landmarks
    semantic_viewpoints: /semantic_viewpoints
    semantic_observed_cones: /semantic_observed_cones
    semantic_candidate_objects: /semantic_candidate_objects
    semantic_observation_rays: /semantic_observation_rays
    semantic_loop_error: /semantic_loop_error
    semantic_save_event: /semantic_save_event
    save_trigger: /semantic_map/save
  camera:
    width: 640
    height: 480
    hfov_deg: 70.0
    yaw_offset_deg: 0.0
  projection:
    min_range_m: 0.18
    max_range_m: 4.0
    target_window_deg: 8.0
    camera_to_laser_yaw_deg: -170.0
    range_window_deg: 12.0
    use_lidar_median: true
    no_range_policy: viewpoint_only
    default_position_sigma_m: 1.2
  classes:
    whitelist:
    - bottle
    - cup
    - backpack
    - chair
    - dining table
    - book
    - potted plant
    - cell phone
    - couch
    dynamic:
    - person
    - dog
    - cat
    small_objects:
    - bottle
    - cup
    - cell phone
    - book
    large_objects:
    - chair
    - dining table
    - couch
  detection_filter:
    min_score_default: 0.25
    min_score_small_object: 0.2
    min_score_observation_only: 0.15
    min_area_ratio: 0.0006
    max_area_ratio: 0.45
    edge_margin_px: 6
    max_box_aspect_ratio: 6.0
    reject_stale: true
  low_confidence_policy:
    min_score_can_observe: 0.15
    min_score_can_landmark: 0.2
    require_lidar_range: true
    require_vote_count: 3
    require_not_edge_box: true
  temporal_vote:
    window_size: 8
    min_votes_candidate: 2
    min_votes_confirmed: 3
    max_time_span_sec: 2.0
    iou_threshold: 0.1
    center_dist_threshold: 0.16
    hold_frames: 4
  landmark_fusion:
    merge_radius_small_m: 0.45
    merge_radius_large_m: 0.8
    confirm_seen_count: 3
    confirm_min_duration_sec: 1.0
    max_position_sigma_m: 0.8
    confidence_decay_sec: 60.0
    min_viewpoint_baseline_m: 0.15
  viewpoints:
    enable: true
    min_translation_m: 0.25
    min_rotation_deg: 20.0
    save_on_detection: true
    view_range_m: 3.0
    view_fov_deg: 70.0
    save_keyframes: true
  loop_quality:
    enable: true
    max_return_xy_error_m: 0.2
    max_return_yaw_error_deg: 12.0
    require_stationary_sec_before_save: 3.0
  storage:
    root_dir: /root/rdk_x5_vln_robot/logs/semantic_mapping
    session_name: auto
    write_jsonl: true
    autosave_sec: 2.0
    save_keyframe_jpeg_quality: 70
  visualization:
    publish_markers: true
    marker_lifetime_sec: 0.0
    landmark_text: true
    observed_cone_markers: true
    show_depth_labels: true
  enabled: true
semantic_explore:
  enabled: true
  hint_topic: /explore_goal_hint
  state_topic: /explore_state_json
  control_frame: map
  use_in_search_only: true
  max_hint_age_sec: 15.0
  min_hint_score: 0.05
  goal_hold_sec: 30.0
  max_goal_select_distance_m: 3.5
  min_goal_select_distance_m: 0.5
  goal_switch_max_distance_m: 0.45
  goal_switch_min_dist_m: 0.45
  blocked_reject_reasons:
  - unsafe_front_clearance
  - emergency_stop
  target_visible_interrupt: false
  observe_after_reach_sec: 0.5
  observe_scan_deg: 0.0
  observe_scan_wz: 0.05
  min_travel_before_reach_m: 0.25
  blacklist_on_arrived: false
  search_prefer_lidar_after_sec: 5.0
  max_goal_age_sec: 20.0
  reselect_interval_sec: 4.0
  max_candidates_validate_per_tick: 4
  max_validate_sec_per_tick: 0.35
  keep_goal_min_sec: 8.0
  switch_score_margin: 0.35
  switch_confirm_count: 3
  step_goal_distance_m: 0.5
  goal_reached_radius_m: 0.22
  goal_timeout_sec: 60.0
  tf_cache_ttl_sec: 0.25
  tf_lookup_timeout_sec: 0.12
  blacklist_radius_m: 0.6
  blacklist_ttl_sec: 180.0
  repeated_observation_decay: 0.6
  failed_region_penalty: 0.8
semantic_priors:
  default:
    context_objects: {}
    target_aliases: []
  cup:
    target_aliases:
    - cup
    - bottle
    - mug
    context_objects:
      dining table: 1.0
      table: 1.0
      chair: 0.35
      shelf: 0.7
  bottle:
    target_aliases:
    - bottle
    - cup
    context_objects:
      dining table: 0.8
      table: 0.8
      shelf: 0.7
      chair: 0.25
  backpack:
    target_aliases:
    - backpack
    - bag
    context_objects:
      chair: 0.8
      dining table: 0.45
      table: 0.45
      couch: 0.55
      wall_side: 0.6
  book:
    target_aliases:
    - book
    context_objects:
      dining table: 0.9
      table: 0.9
      chair: 0.3
  plant:
    target_aliases:
    - potted plant
    - plant
    context_objects:
      wall_side: 0.6
      window_side: 0.6
      table: 0.4
frontier:
  enabled: true
  map_topic: /map
  min_cluster_cells: 3
  max_frontiers: 12
  unknown_value: -1
  free_threshold: 20
  occupied_threshold: 65
  inflation_radius_m: 0.22
  min_distance_m: 0.20
  max_distance_m: 3.0
  observation_standoff_m: 0.8
  unknown_gain_radius_m: 0.6
  require_goal_on_known_free: true
  scanned_free_candidates: true
  scanned_free_max_candidates: 12
planner:
  mode: astar
  astar_enabled: true
  require_astar_path: true
  astar_fallback_bearing: true
  allow_unknown: false
  grid_resolution_override: null
  path_publish_topic: /explore_path
  path_follow_lookahead_m: 0.35
  follow_planned_path: true
goal_validation:
  enabled: true
  strict: true
  require_inside_map: true
  require_known_free: true
  unknown_as_obstacle: false
  occupied_threshold: 50
  robot_radius_m: 0.15
  safety_margin_m: 0.06
  min_clearance_m: 0.12
  min_astar_path_points: 2
safe_goal_projection:
  enabled: true
  max_projection_radius_m: 1.0
  projection_step_m: 0.15
  projection_max_samples: 16
  prefer_nearest: true
  require_unknown_gain: false
  min_unknown_gain_cells: 1
  frontier_standoff_m: 0.35
  landmark_view_min_radius_m: 0.45
  landmark_view_max_radius_m: 1.0
  bearing_first:
    max_vx: 0.05
    max_wz: 0.05
    turn_in_place_threshold_rad: 0.18
    forward_bearing_threshold_rad: 0.14
    align_max_sec: 10.0
    step_mode: distance
    step_distance_m: 0.45
    pulse_sec: 0.35
    inter_burst_pause_sec: 0.12
    observe_sec: 0.12
candidate_scoring:
  semantic_score: 0.15
  information_gain: 0.30
  reachability: 0.3
  novelty: 0.10
  safety_margin: 0.15
  known_map_bonus: 0.12
  unknown_goal_penalty: 1.0
  qwen_text_score: 0.0
  blacklist_penalty: 0.45
  repeated_observation_penalty: 0.35
  travel_cost_penalty: 0.25
qwen_text:
  enabled: false
  provider: ollama
  host: http://127.0.0.1:11434
  model: qwen2.5:latest
  timeout_sec: 4.0
  num_ctx: 512
  num_predict: 96
  temperature: 0.0
  use_for_instruction_parse: true
  use_for_candidate_rerank: true
  hard_override: false
  min_confidence: 0.55
  weight: 0.05
debug: true
